<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <title>إدارة الاشتراكات</title>
  <link rel="icon" href="icon-192.png?v=3">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="a-loading" class="screen"><p class="muted center" style="padding-top:30vh">جاري التحميل...</p></section>

  <section id="a-login" class="screen hidden">
    <div class="login-box">
      <div class="logo">🔑</div>
      <h1>إدارة الاشتراكات</h1>
      <p class="muted">سجّل الدخول بحساب المدير.</p>
      <button class="btn btn-google" id="a-google" type="button">الدخول بحساب جوجل</button>
      <div class="divider"><span>أو</span></div>
      <input type="email" id="a-email" placeholder="البريد الإلكتروني للمدير" autocomplete="email">
      <input type="password" id="a-pass" placeholder="كلمة المرور" autocomplete="current-password">
      <p class="msg" id="a-msg" role="status"></p>
      <button class="btn btn-primary" id="a-login-btn" type="button">دخول</button>
      <button class="link" id="a-forgot" type="button">تعيين كلمة المرور أو نسيتها؟ (رابط إلى بريد المدير)</button>
    </div>
  </section>

  <section id="a-main" class="screen hidden">
    <header class="topbar">
      <h2>إدارة الاشتراكات</h2>
      <div class="bar-actions">
        <button class="icon-btn wide" id="a-logout" type="button">خروج</button>
      </div>
    </header>
    <p class="msg" id="a-err" role="alert"></p>

    <div class="stats">
      <div class="stat warn"><b id="s-pending">0</b><span>بانتظار المراجعة</span></div>
      <div class="stat good"><b id="s-approved">0</b><span>مشترك مفعّل</span></div>
      <div class="stat"><b id="s-revenue">0</b><span>إجمالي الإيراد (جنيه)</span></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="pending" role="tab" type="button">قيد المراجعة <span id="n-pending" class="badge"></span></button>
      <button class="tab" data-tab="approved" role="tab" type="button">المفعّلون <span id="n-approved" class="badge"></span></button>
      <button class="tab" data-tab="other" role="tab" type="button">مرفوضة / موقوفة <span id="n-other" class="badge"></span></button>
    </div>
    <input type="search" id="a-search" class="a-search" placeholder="ابحث بالبريد أو الاسم أو الرمز" autocomplete="off">

    <div class="tab-panel" id="panel-pending">
      <div id="list-pending"></div>
      <p class="muted center hidden" id="empty-pending">لا توجد طلبات.</p>
    </div>
    <div class="tab-panel hidden" id="panel-approved"><div id="list-approved"></div></div>
    <div class="tab-panel hidden" id="panel-other"><div id="list-other"></div></div>

    <details class="adm-card acct">
      <summary>حساب المدير والأمان</summary>
      <div class="row2"><span>الحساب</span><span id="a-who" dir="ltr"></span></div>
      <button class="btn btn-ghost" id="a-chpass" type="button" style="margin-top:8px">تغيير كلمة المرور (بتأكيد من البريد)</button>
      <p class="msg" id="a-pass-msg" role="status"></p>
    </details>
  </section>

<script type="module" src="admin.js"></script>
</body>
</html>
